[project]
name = "resume-search"
version = "1.0.0"
description = "Rank resumes against a role with TF-IDF, with local accounts and optional Gemini tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]  # long UI strings and prompts; `ruff format` keeps code lines tidy

[tool.ruff.lint.isort]
known-first-party = ["resume_search", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["resume_search"]
branch = true
